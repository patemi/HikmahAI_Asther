name: asther
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    container_name: asther_postgre
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astheron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asther}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astheron} -d ${POSTGRES_DB:-asther}"]
      interval: 10s
      timeout: 5s
      retries: 5

  asther-web:
    build:
      context: ./asther
      dockerfile: Dockerfile
    restart: always
    container_name: asther-web
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-astheron}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-asther}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_USERNAME=${DEFAULT_USERNAME:-asther}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-admin}
      - MEMORY_LENGTH=${MEMORY_LENGTH:-5}
      - APP_URL=${APP_URL:-http://localhost:5000}
      - CHAT_REQUESTS_PER_MINUTE=${CHAT_REQUESTS_PER_MINUTE:-10}
      - CHAT_REQUESTS_PER_DAY=${CHAT_REQUESTS_PER_DAY:-100}
      - MODEL_REQUESTS_PER_DAY=${MODEL_REQUESTS_PER_DAY:-2000}
      - MODEL_TOKENS_PER_DAY=${MODEL_TOKENS_PER_DAY:-500000}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CHAT_RETENTION_DAYS=${CHAT_RETENTION_DAYS:-0}
      - BEARER_TOKEN=${BEARER_TOKEN}
      - BASE_URL=${BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
