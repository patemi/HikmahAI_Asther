name: asther_dev
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    container_name: asther_postgre_dev
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astheron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD using --env-file .env from the repository root}
      POSTGRES_DB: ${POSTGRES_DB:-asther}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astheron} -d ${POSTGRES_DB:-asther}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
